" width="200" height="50" rx="12"/><text x="48" y="369" class="dg-t">AI jobs</text><text x="48" y="386" class="dg-s">previews & reviews</text></g><g class="dg-node dg-plat"><rect x="670" y="35" width="220" height="58" rx="12"/><circle cx="692" cy="64" r="5"/><text x="708" y="60" class="dg-t">Public website</text><text x="708" y="78" class="dg-s">oekfb.eu</text></g><g class="dg-node dg-plat"><rect x="670" y="113" width="220" height="58" rx="12"/><circle cx="692" cy="142" r="5"/><text x="708" y="138" class="dg-t">Mobile app</text><text x="708" y="156" class="dg-s">iOS & Android</text></g><g class="dg-node dg-plat"><rect x="670" y="191" width="220" height="58" rx="12"/><circle cx="692" cy="220" r="5"/><text x="708" y="216" class="dg-t">Team portal</text><text x="708" y="234" class="dg-s">team.oekfb.eu</text></g><g class="dg-node dg-plat"><rect x="670" y="269" width="220" height="58" rx="12"/><circle cx="692" cy="298" r="5"/><text x="708" y="294" class="dg-t">Referee portal</text><text x="708" y="312" class="dg-s">match day, live</text></g><g class="dg-node dg-plat"><rect x="670" y="347" width="220" height="58" rx="12"/><circle cx="692" cy="376" r="5"/><text x="708" y="372" class="dg-t">Admin dashboard</text><text x="708" y="390" class="dg-s">the federation office</text></g><g class="dg-core"><rect x="345" y="165" width="210" height="110" rx="18"/><text x="450.0" y="210.0" text-anchor="middle" class="dg-ct">One API</text><text x="450.0" y="236.0" text-anchor="middle" class="dg-cs">Swift · Vapor</text><text x="450.0" y="256.0" text-anchor="middle" class="dg-cs">one source of truth</text></g></svg><figcaption>Every platform reads and writes through the same API, so a goal entered by a referee shows up in the app, on the website and in the tables at once.</figcaption></figure>
